```yaml
server:
  port: 8080

spring:
  application:
    name: medical-records-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:/app/data/medicalrecordsdb;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${H2_PASSWORD}
    
  h2:
    console:
      enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000

  storage:
    upload-dir: ${APP_UPLOAD_DIR:/app/uploads/medical-documents}

  supabase:
    url: ${SUPABASE_URL:}
    key: ${SUPABASE_SECRET_KEY:}
    bucket: ${SUPABASE_BUCKET:medical-documents}

  resend:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

  brand:
    name: "My Friend Insurancewala"
    app-title: "My Family Medical Records"

---
# Production Profile with PostgreSQL
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicalrecords}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
```